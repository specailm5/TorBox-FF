<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TorBox Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://torbox.app/favicon.ico" alt="TorBox" width="32" height="32" onerror="this.style.display='none'">
      <h1>TorBox Settings</h1>
    </div>

    <div class="card">
      <div class="card-header">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
        <h2>API Configuration</h2>
      </div>
      <p class="desc">Enter your TorBox API key to enable integration.</p>

      <div class="form-group">
        <label for="apiKey">API Key</label>
        <div class="input-row">
          <input type="password" id="apiKey" placeholder="Paste your API key here">
          <button id="toggleVisible" class="btn icon-btn" title="Show/Hide">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
          </button>
        </div>
      </div>

      <div class="button-group">
        <button id="saveKey" class="btn primary">Save Key</button>
        <button id="testKey" class="btn secondary">Test Connection</button>
        <button id="removeKey" class="btn danger">Remove Key</button>
      </div>

      <div id="apiStatus" class="status-msg"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <h2>Scanning Preferences</h2>
      </div>

      <label class="checkbox-label">
        <div class="checkbox-wrapper">
          <input type="checkbox" id="autoScan">
          <div class="custom-checkbox"></div>
        </div>
        <span>Automatically scan for TorBox links on page load</span>
      </label>

      <label class="checkbox-label">
        <div class="checkbox-wrapper">
          <input type="checkbox" id="showUncached">
          <div class="custom-checkbox"></div>
        </div>
        <span>Show indicator for "Not Cached" links</span>
      </label>

      <label class="checkbox-label">
        <div class="checkbox-wrapper">
          <input type="checkbox" id="showErrors">
          <div class="custom-checkbox"></div>
        </div>
        <span>Show indicator if checking fails</span>
      </label>

      <div class="form-group" style="margin-top: 16px;">
        <label for="displayMode">Display Mode</label>
        <div class="input-row">
          <select id="displayMode" class="select-dropdown">
            <option value="buttons">Webpage Buttons (Default)</option>
            <option value="list">Popup List View</option>
          </select>
        </div>
      </div>

      <div class="button-group" style="margin-top: 16px;">
        <button id="saveSettings" class="btn primary">Save Preferences</button>
      </div>

      <div id="settingsStatus" class="status-msg"></div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
