<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>TorBox Extension Settings</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <img src="https://torbox.app/favicon.ico" alt="TorBox" width="32" height="32" onerror="this.style.display='none'">
      <h1>TorBox Extension Settings</h1>
    </div>

    <div class="card">
      <h2>API Configuration</h2>
      <p class="desc">Enter your TorBox API key.</p>

      <div class="form-group">
        <label for="apiKey">API Key</label>
        <div class="input-row">
          <input type="password" id="apiKey" placeholder="Paste your API key here">
          <button id="toggleVisible" title="Show/Hide">👁️</button>
        </div>
      </div>

      <div class="button-group">
        <button id="saveKey" class="btn primary">Save Key</button>
        <button id="testKey" class="btn secondary">Test Connection</button>
        <button id="removeKey" class="btn danger">Remove Key</button>
      </div>

      <div id="apiStatus" class="status-msg"></div>
    </div>

    <div class="card">
      <h2>Scanning Preferences</h2>

      <label class="checkbox-label">
        <input type="checkbox" id="autoScan">
        <span>Automatically scan for TorBox links on page load</span>
      </label>

      <label class="checkbox-label">
        <input type="checkbox" id="showUncached">
        <span>Show indicator for "Not Cached" links</span>
      </label>

      <label class="checkbox-label">
        <input type="checkbox" id="showErrors">
        <span>Show indicator if checking fails</span>
      </label>

      <div class="button-group" style="margin-top: 16px;">
        <button id="saveSettings" class="btn primary">Save Preferences</button>
      </div>

      <div id="settingsStatus" class="status-msg"></div>
    </div>
  </div>
  <script src="options.js"></script>
</body>

</html>
